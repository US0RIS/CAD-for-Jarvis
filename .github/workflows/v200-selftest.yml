name: ForgeCAD 2.0 design intelligence

on:
  push:
    branches: [main, forgecad/full-v110-scope]
    paths:
      - 'services/forge-engine/forge_engine/v200/**'
      - 'services/forge-engine/forge_engine/main_v2.py'
      - 'services/forge-engine/forge_engine/engineering_state.py'
      - 'services/forge-engine/forge_engine/v110/**'
      - '.github/workflows/v200-selftest.yml'
  workflow_dispatch:

jobs:
  transactional-design:
    name: Architecture, parametric CAD, cached 3D, FEA, tolerances, dynamics, electrical, branches, campaigns, manufacturing, and evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run ForgeCAD 2.0 design self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.selftest
      - name: Run ForgeCAD 2.0 constrained sketch self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-sketch-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.sketch_selftest
      - name: Run ForgeCAD 2.0 parametric expression self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-parametric-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.parametric_selftest
      - name: Run ForgeCAD 2.0 scene cache self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-scene-cache-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.scene_cache_selftest
      - name: Run ForgeCAD 2.0 3D solid FEA self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-fea-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.structural_fea_selftest
      - name: Run ForgeCAD 2.0 project boundary-condition FEA self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-project-fea-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.project_structural_selftest
      - name: Run ForgeCAD 2.0 parametric project SolidFEA self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-parametric-project-fea-selftest
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v200.project_structural_parametric_selftest
      - name: Run ForgeCAD 2.0 tolerance-stack self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v200-tolerance-selftest
