name: ForgeCAD 6.0 milestone 2 regression

on:
  push:
    branches: [forgecad/6.0.0]
    paths:
      - 'services/forge-engine/**'
      - '.github/workflows/v600-milestone2.yml'
  workflow_dispatch:

jobs:
  milestone-2:
    name: Geometry-backed assembly truth
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run geometry-backed mount acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m2-mount
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone2_selftest
      - name: Run full interface-frame mate acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m2-frame
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.frame_mate_selftest
      - name: Run spatial constraint-rank acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m2-rank
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.constraint_rank_selftest
      - name: Preserve ForgeCAD 6.0 milestone 1 acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m1
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.selftest
      - name: Preserve ForgeCAD 3.1 integration regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v310
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v310.selftest
      - name: Preserve complete historical engineering regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-legacy
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '1'
        run: python -m forge_engine.full_scope_selftest
      - name: Re-run solid FEA benchmark
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-fea
          CI: 'true'
        run: python -m forge_engine.v200.structural_fea_selftest
