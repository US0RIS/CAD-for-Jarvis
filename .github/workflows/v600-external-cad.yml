name: ForgeCAD 6.0 external manufacturer CAD validation

on:
  push:
    branches: [forgecad/6.0.0]
    paths:
      - 'services/forge-engine/forge_engine/v600/manufacturer_cad_registration.py'
      - 'services/forge-engine/forge_engine/v600/manufacturer_cad_registration_selftest.py'
      - 'services/forge-engine/forge_engine/v600/manufacturer_truth.py'
      - 'services/forge-engine/forge_engine/v110/realistic_components.py'
      - '.github/workflows/v600-external-cad.yml'
  workflow_dispatch:

jobs:
  manufacturer-cad:
    name: Manufacturer STEP frame registration
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Download, register and verify real manufacturer STEP assets
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-external-cad
          FORGECAD_ALLOW_CAD_DOWNLOADS: '1'
          FORGECAD_EXTERNAL_CAD_ACCEPTANCE: '1'
          CI: 'true'
        run: python -m forge_engine.v600.manufacturer_cad_registration_selftest
