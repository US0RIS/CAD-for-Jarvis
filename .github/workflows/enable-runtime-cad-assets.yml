name: Enable runtime manufacturer CAD

on:
  push:
    branches: [forgecad/full-v110-scope]
    paths: ['.github/workflows/enable-runtime-cad-assets.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad/full-v110-scope
      - name: Enable bounded first-use CAD downloads
        run: |
          python - <<'PY'
          from pathlib import Path

          p=Path('services/forge-engine/forge_engine/v110/physical_components.py')
          s=p.read_text()
          old='''def component_parts(obj):\n    component = component_definition(obj)\n    realistic = _realistic_components.component_parts(obj, component, allow_download=False) if component else None\n    return realistic if realistic else _legacy_component_parts(obj)\n'''
          new='''def component_parts(obj):\n    component = component_definition(obj)\n    # Normal desktop sessions resolve published manufacturer CAD once and cache it.\n    # CI remains deterministic/offline and exercises the detailed parametric fallback.\n    import os as _os\n    explicit = _os.environ.get("FORGECAD_ALLOW_CAD_DOWNLOADS")\n    allow_download = (explicit.strip().lower() in {"1", "true", "yes"}) if explicit is not None else not bool(_os.environ.get("CI"))\n    realistic = _realistic_components.component_parts(obj, component, allow_download=allow_download) if component else None\n    return realistic if realistic else _legacy_component_parts(obj)\n'''
          if old not in s: raise SystemExit('physical component override block not found')
          p.write_text(s.replace(old,new,1))

          p=Path('services/forge-engine/forge_engine/v110/realistic_components.py')
          s=p.read_text()
          s=s.replace('import argparse\n', 'import argparse\nimport threading\n', 1)
          marker='CACHE_ASSET_DIR = registry.ASSET_DIR / "manufacturer"\n'
          insertion='''CACHE_ASSET_DIR = registry.ASSET_DIR / "manufacturer"\n_DOWNLOAD_LOCK = threading.RLock()\n_DOWNLOAD_FAILURES: set[str] = set()\n'''
          if marker not in s: raise SystemExit('asset cache marker missing')
          s=s.replace(marker,insertion,1)
          s=s.replace('with urllib.request.urlopen(request, timeout=60) as response, raw_path.open("wb") as handle:', 'with urllib.request.urlopen(request, timeout=15) as response, raw_path.open("wb") as handle:', 1)
          old='''def resolve_step(component_id: str, *, allow_download: bool = False) -> Path | None:\n    for candidate in _step_candidates(component_id):\n        if _looks_like_step(candidate):\n            return candidate\n    if allow_download and component_id in CAD_ASSETS:\n        try:\n            return download_step(component_id)\n        except Exception:\n            return None\n    return None\n'''
          new='''def resolve_step(component_id: str, *, allow_download: bool = False) -> Path | None:\n    for candidate in _step_candidates(component_id):\n        if _looks_like_step(candidate):\n            return candidate\n    if allow_download and component_id in CAD_ASSETS:\n        with _DOWNLOAD_LOCK:\n            if component_id in _DOWNLOAD_FAILURES:\n                return None\n            # Another geometry request may have populated the cache while this one waited.\n            for candidate in _step_candidates(component_id):\n                if _looks_like_step(candidate):\n                    return candidate\n            try:\n                return download_step(component_id)\n            except Exception:\n                _DOWNLOAD_FAILURES.add(component_id)\n                return None\n    return None\n'''
          if old not in s: raise SystemExit('resolve_step block not found')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/forge-engine/forge_engine/v110/physical_components.py services/forge-engine/forge_engine/v110/realistic_components.py
          git commit -m 'Resolve manufacturer STEP geometry on first use'
          git push origin HEAD:forgecad/full-v110-scope
