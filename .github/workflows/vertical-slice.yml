name: ForgeCAD v2 vertical slice

on:
  push:
    branches: [main, forgecad/full-v110-scope]
  pull_request:
  workflow_dispatch:

jobs:
  windows-primary:
    name: Windows 11 primary
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Forge Engine
        shell: pwsh
        run: |
          python -m venv services/forge-engine/.venv
          services/forge-engine/.venv/Scripts/python.exe -m pip install --upgrade pip
          services/forge-engine/.venv/Scripts/python.exe -m pip install -e services/forge-engine
      - name: Full engineering and design-intelligence self-test
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/services/forge-engine"
          $env:FORGECAD_DATA_DIR = "$env:RUNNER_TEMP\forgecad-full-scope-selftest"
          services/forge-engine/.venv/Scripts/python.exe -m forge_engine.full_scope_selftest
          services/forge-engine/.venv/Scripts/python.exe -c "from forge_engine.v200 import DESIGN_INTELLIGENCE_VERSION; from forge_engine.v200 import design_intelligence as d; from forge_engine.engineering_state import PROJECT; a=d.bootstrap_architecture('notify me when a door is opened', PROJECT.snapshot()); c=d.build_planner_context('notify me when a door is opened', a, PROJECT.snapshot()); assert DESIGN_INTELLIGENCE_VERSION=='2.0.0'; assert any(f['capability']=='physical_state_sensing' for f in c['functions']); assert any(x['id']=='sensor.adafruit.magnetic_contact_375' for x in c['candidate_components']); print('ForgeCAD 2.0 architecture self-test: PASS')"
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Typecheck and build Electron renderer
        run: |
          pnpm --filter @forgecad/desktop typecheck
          pnpm --filter @forgecad/desktop build
      - name: Install Chromium acceptance runtime
        run: pnpm --filter @forgecad/desktop exec playwright install chromium
      - name: Start ForgeCAD 2.0 production-like engine
        shell: pwsh
        run: |
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE/services/forge-engine"
          $env:FORGECAD_SESSION_TOKEN = 'test-session'
          $env:FORGECAD_OLLAMA_MODEL = 'qwen3:8b'
          $env:FORGECAD_DEMO_AGENT = '1'
          $env:FORGECAD_DATA_DIR = "$env:RUNNER_TEMP\forgecad-e2e-state"
          $env:CI = 'false'
          $env:FORGECAD_ACCEPTANCE_WORKSPACE = '0'
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/services/forge-engine/.venv/Scripts/python.exe" -ArgumentList '-m','uvicorn','forge_engine.main_v2:app','--host','127.0.0.1','--port','8765','--log-level','warning' -WorkingDirectory "$env:GITHUB_WORKSPACE/services/forge-engine" -PassThru
          $p.Id | Set-Content "$env:RUNNER_TEMP/forge-engine.pid"
          $deadline = (Get-Date).AddSeconds(45)
          $healthy = $false
          do {
            try { $r = Invoke-RestMethod http://127.0.0.1:8765/v2/health; if ($r.ok -and $r.engine_version -eq '2.0.0') { $healthy = $true; break } } catch {}
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $deadline)
          if (-not $healthy) { throw 'ForgeCAD 2.0 Forge Engine did not become healthy' }
          $headers = @{ 'X-ForgeCAD-Session' = 'test-session' }
          $body = @{ text = 'notify me when a door is opened'; use_model = $false } | ConvertTo-Json
          $architecture = Invoke-RestMethod http://127.0.0.1:8765/v2/design/architecture -Method Post -Headers $headers -ContentType 'application/json' -Body $body -TimeoutSec 20
          if (-not (@($architecture.functions) | Where-Object { $_.capability -eq 'physical_state_sensing' })) { throw 'ForgeCAD 2.0 did not infer physical-state sensing.' }
          if (-not (@($architecture.candidate_components) | Where-Object { $_.id -eq 'sensor.adafruit.magnetic_contact_375' })) { throw 'ForgeCAD 2.0 did not resolve a real door-contact candidate.' }
      - name: Run browser full-scope acceptance
        run: pnpm --filter @forgecad/desktop e2e
      - name: Upload Playwright diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-playwright-report
          path: |
            apps/desktop/playwright-report
            apps/desktop/test-results
          if-no-files-found: ignore

  macos-secondary:
    name: macOS secondary smoke
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Forge Engine
        run: |
          python -m venv services/forge-engine/.venv
          services/forge-engine/.venv/bin/python -m pip install --upgrade pip
          services/forge-engine/.venv/bin/python -m pip install -e services/forge-engine
      - name: Full engineering and design-intelligence self-test
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-full-scope-selftest
        run: |
          services/forge-engine/.venv/bin/python -m forge_engine.full_scope_selftest
          services/forge-engine/.venv/bin/python -c "from forge_engine.v200 import design_intelligence as d; from forge_engine.engineering_state import PROJECT; a=d.bootstrap_architecture('notify me when a door is opened',PROJECT.snapshot()); c=d.build_planner_context('notify me when a door is opened',a,PROJECT.snapshot()); assert any(x['id']=='sensor.adafruit.magnetic_contact_375' for x in c['candidate_components']); print('macOS ForgeCAD 2.0 design intelligence: PASS')"
      - name: Install and compile shared desktop
        run: |
          pnpm install --frozen-lockfile=false
          pnpm --filter @forgecad/desktop typecheck
          pnpm --filter @forgecad/desktop build
      - name: Smoke ForgeCAD 2.0 engine entrypoint
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_OLLAMA_MODEL: qwen3:8b
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-import-smoke
        run: |
          services/forge-engine/.venv/bin/python -c "from forge_engine.main_v2 import app; from forge_engine.main import CONFIGURED_MODEL, PROJECT; from forge_engine import __version__; assert app and CONFIGURED_MODEL == 'qwen3:8b' and __version__ == '2.0.0'; assert PROJECT.registry_stats()['total'] >= 1400; assert len(PROJECT.scene_manifest()['parts']) >= 6; print('macOS ForgeCAD 2.0 smoke: PASS')"
