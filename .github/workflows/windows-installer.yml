name: ForgeCAD Windows Installer

on:
  push:
    branches: [main, forgecad/full-v110-scope]
    paths:
      - 'apps/desktop/**'
      - 'services/forge-engine/**'
      - '.github/workflows/windows-installer.yml'
      - 'package.json'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

jobs:
  installer:
    name: Build ForgeCAD-Setup.exe
    runs-on: windows-2025
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4

      - name: Confirm clean checkout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Write-Host '> git reset --hard HEAD'
          git reset --hard HEAD
          Write-Host '> git clean -ffdx'
          git clean -ffdx
          $head = git rev-parse HEAD
          $status = git status --porcelain
          Write-Host "HEAD=$head"
          if ($status) { throw "Working tree is not clean:`n$status" }
          Write-Host 'Working tree: clean'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and self-test full engineering layer
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine pyinstaller
          $env:FORGECAD_DATA_DIR = "$env:RUNNER_TEMP\forgecad-full-scope-selftest"
          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\services\forge-engine"
          python -m forge_engine.full_scope_selftest

      - name: Build standalone Forge Engine
        shell: pwsh
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --name forge-engine `
            --collect-all cadquery `
            --collect-all OCP `
            --collect-all vtkmodules `
            --collect-submodules forge_engine.v110 `
            --distpath services/forge-engine/dist `
            --workpath services/forge-engine/build/pyinstaller `
            --specpath services/forge-engine/build `
            services/forge-engine/forge_engine/desktop_entry.py
          if (-not (Test-Path 'services/forge-engine/dist/forge-engine.exe')) { throw 'Forge Engine executable was not produced.' }

      - name: Smoke bundled Forge Engine full scope
        shell: pwsh
        run: |
          $env:FORGECAD_PORT = '8877'
          $env:FORGECAD_SESSION_TOKEN = 'installer-smoke'
          $env:FORGECAD_OLLAMA_MODEL = 'qwen3:8b'
          $env:FORGECAD_DATA_DIR = "$env:RUNNER_TEMP\forgecad-bundled-smoke"
          $p = Start-Process -FilePath "$env:GITHUB_WORKSPACE/services/forge-engine/dist/forge-engine.exe" -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $headers = @{ 'X-ForgeCAD-Session' = 'installer-smoke' }
            $health = $null
            do {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8877/v2/health -TimeoutSec 2
                if ($health.ok -and $health.api_version -eq '2') { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if (-not ($health.ok -and $health.engineering_layer -eq 'v1.1-full-scope' -and $health.engine_version -eq '1.1.2')) { throw 'Bundled Forge Engine did not report ForgeCAD 1.1.2 full scope.' }
            $stats = Invoke-RestMethod http://127.0.0.1:8877/v2/component-registry/stats -Headers $headers -TimeoutSec 20
            if ([int]$stats.total -lt 1400) { throw "Expected at least 1400 registry components, got $($stats.total)." }
            $search = Invoke-RestMethod 'http://127.0.0.1:8877/v2/components?q=gear' -Headers $headers -TimeoutSec 20
            if (@($search.items).Count -le 30) { throw "Filtered component search is still capped: $(@($search.items).Count)" }
            $focad = Join-Path $env:RUNNER_TEMP 'bundled-design.focad'
            Invoke-WebRequest http://127.0.0.1:8877/v2/project/export -Headers $headers -OutFile $focad -TimeoutSec 30
            python -c "import zipfile,json; z=zipfile.ZipFile(r'$focad'); m=json.loads(z.read('manifest.json')); assert m['format']=='focad' and m['format_version']==1"
            $scene = Invoke-RestMethod http://127.0.0.1:8877/v2/scene -Headers $headers -TimeoutSec 60
            if (-not $scene.authoritative -or @($scene.parts).Count -lt 6) { throw 'Canonical scene is missing the full acceptance assembly.' }
            $validation = Invoke-RestMethod http://127.0.0.1:8877/v2/validation -Headers $headers -TimeoutSec 60
            if (-not $validation.metrics) { throw 'Validation payload did not contain engineering metrics.' }
            Write-Host "Bundled full scope: registry=$($stats.total) search=$(@($search.items).Count) scene_parts=$(@($scene.parts).Count)"
          } finally {
            if (-not $p.HasExited) { Stop-Process -Id $p.Id -Force }
          }

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck desktop
        run: pnpm --filter @forgecad/desktop typecheck

      - name: Build NSIS installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: pnpm --filter @forgecad/desktop dist:win

      - name: Verify installer exists
        shell: pwsh
        run: |
          $installer = Get-ChildItem 'apps/desktop/release/ForgeCAD-Setup-1.1.2.exe' | Select-Object -First 1
          if (-not $installer) { throw 'ForgeCAD 1.1.2 installer was not produced.' }
          Write-Host "Installer: $($installer.FullName)"
          Write-Host "Size: $([math]::Round($installer.Length / 1MB, 1)) MB"

      - name: Install and smoke-test packaged ForgeCAD full scope
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = (Get-ChildItem 'apps/desktop/release/ForgeCAD-Setup-1.1.2.exe' | Select-Object -First 1).FullName
          if (-not $installer) { throw 'ForgeCAD installer was not produced.' }
          $installDir = Join-Path $env:RUNNER_TEMP 'ForgeCAD-Installed-Copy'
          if (Test-Path $installDir) { Remove-Item $installDir -Recurse -Force }

          Write-Host "> Start-Process -FilePath '$installer' -ArgumentList '/S','/D=$installDir' -Wait -PassThru"
          $install = Start-Process -FilePath $installer -ArgumentList @('/S', "/D=$installDir") -Wait -PassThru
          Write-Host "Installer exit code: $($install.ExitCode)"
          if ($install.ExitCode -ne 0) { throw "Installer failed with exit code $($install.ExitCode)." }

          $app = Join-Path $installDir 'ForgeCAD.exe'
          $engine = Join-Path $installDir 'resources\forge-engine\forge-engine.exe'
          if (-not (Test-Path $app)) { throw "Installed desktop executable missing: $app" }
          if (-not (Test-Path $engine)) { throw "Installed Forge Engine executable missing: $engine" }
          $version = (Get-Item $app).VersionInfo.ProductVersion
          Write-Host "Installed ProductVersion: $version"
          if (-not $version.StartsWith('1.1.2')) { throw "Expected installed ProductVersion 1.1.2, got $version" }

          $env:FORGECAD_PORT = '8878'
          $env:FORGECAD_SESSION_TOKEN = 'installed-copy-smoke'
          $env:FORGECAD_OLLAMA_MODEL = 'qwen3:8b'
          $env:FORGECAD_DATA_DIR = "$env:RUNNER_TEMP\forgecad-installed-smoke-state"
          $engineProcess = Start-Process -FilePath $engine -PassThru -WindowStyle Hidden
          try {
            $deadline = (Get-Date).AddSeconds(60)
            $health = $null
            $headers = @{ 'X-ForgeCAD-Session' = 'installed-copy-smoke' }
            do {
              try {
                $health = Invoke-RestMethod http://127.0.0.1:8878/v2/health -TimeoutSec 2
                if ($health.ok -and $health.api_version -eq '2') { break }
              } catch {}
              Start-Sleep -Milliseconds 250
            } while ((Get-Date) -lt $deadline)
            if (-not ($health.ok -and $health.engineering_layer -eq 'v1.1-full-scope' -and $health.engine_version -eq '1.1.2')) { throw 'Installed Forge Engine failed 1.1.2 full-scope health smoke test.' }

            $stats = Invoke-RestMethod http://127.0.0.1:8878/v2/component-registry/stats -Headers $headers -TimeoutSec 20
            if ([int]$stats.total -lt 1400) { throw "Installed registry incomplete: $($stats.total)" }
            $search = Invoke-RestMethod 'http://127.0.0.1:8878/v2/components?q=gear' -Headers $headers -TimeoutSec 20
            if (@($search.items).Count -le 30) { throw "Installed filtered search still capped: $(@($search.items).Count)" }
            $focad = Join-Path $env:RUNNER_TEMP 'installed-design.focad'
            Invoke-WebRequest http://127.0.0.1:8878/v2/project/export -Headers $headers -OutFile $focad -TimeoutSec 30
            python -c "import zipfile,json; z=zipfile.ZipFile(r'$focad'); m=json.loads(z.read('manifest.json')); assert m['format']=='focad'"

            $project = Invoke-RestMethod http://127.0.0.1:8878/v2/project -Headers $headers -TimeoutSec 20
            if (-not (@($project.parts) | Where-Object { $_.component_ref -eq 'compute.raspberry_pi_5_8gb' })) { throw 'Installed acceptance project is missing Raspberry Pi 5.' }
            $scene = Invoke-RestMethod http://127.0.0.1:8878/v2/scene -Headers $headers -TimeoutSec 60
            if (-not $scene.authoritative -or @($scene.parts).Count -lt 6) { throw 'Installed canonical scene failed.' }
          } finally {
            if (-not $engineProcess.HasExited) { Stop-Process -Id $engineProcess.Id -Force }
          }

          $appProcess = Start-Process -FilePath $app -ArgumentList '--disable-gpu' -PassThru
          $childEngine = $null
          try {
            $deadline = (Get-Date).AddSeconds(45)
            do {
              Start-Sleep -Milliseconds 500
              $appProcess.Refresh()
              if ($appProcess.HasExited) { throw "Installed ForgeCAD exited during launch smoke with code $($appProcess.ExitCode)." }
              $childEngine = Get-CimInstance Win32_Process -Filter "Name='forge-engine.exe'" -ErrorAction SilentlyContinue |
                Where-Object { $_.ExecutablePath -eq $engine } |
                Select-Object -First 1
            } while (-not $childEngine -and (Get-Date) -lt $deadline)
            if (-not $childEngine) { throw 'Installed ForgeCAD did not start its bundled Forge Engine within 45 seconds.' }
            Write-Host "Installed desktop launch: PASS pid=$($appProcess.Id) bundled_engine_pid=$($childEngine.ProcessId)"
          } finally {
            if (-not $appProcess.HasExited) { Stop-Process -Id $appProcess.Id -Force }
            if ($childEngine) { Stop-Process -Id $childEngine.ProcessId -Force -ErrorAction SilentlyContinue }
          }

          $uninstaller = Get-ChildItem $installDir -Filter 'Uninstall*.exe' | Select-Object -First 1
          if (-not $uninstaller) { throw "Uninstaller missing from $installDir" }
          $uninstall = Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru
          if ($uninstall.ExitCode -ne 0) { throw "Uninstaller failed with exit code $($uninstall.ExitCode)." }
          $deadline = (Get-Date).AddSeconds(30)
          while ((Test-Path $app) -and (Get-Date) -lt $deadline) { Start-Sleep -Milliseconds 250 }
          if (Test-Path $app) { throw "Installed ForgeCAD executable still exists after uninstall: $app" }
          Write-Host 'Installed-copy full-scope smoke test: PASS'

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-Windows-Installer
          path: apps/desktop/release/ForgeCAD-Setup-1.1.2.exe
          if-no-files-found: error
          compression-level: 0
