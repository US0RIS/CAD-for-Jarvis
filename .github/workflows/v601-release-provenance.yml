name: ForgeCAD 6.0.1 Release Provenance

on:
  workflow_run:
    workflows: ['ForgeCAD 6.0.1 Native Release']
    types: [completed]
    branches: [forgecad/6.0.1]

permissions:
  contents: write
  actions: read

concurrency:
  group: forgecad-6.0.1-release-provenance
  cancel-in-progress: false

jobs:
  bind-release:
    name: Bind release to native-tested source
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_RUN_ID: ${{ github.event.workflow_run.id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require successful publish job
        shell: bash
        run: |
          set -euo pipefail
          PUBLISH_CONCLUSION=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${RELEASE_RUN_ID}/jobs?per_page=100" \
            --jq '.jobs[] | select(.name == "Publish ForgeCAD 6.0.1") | .conclusion' | tail -n 1)
          if [ "$PUBLISH_CONCLUSION" != "success" ]; then
            echo "Native workflow concluded successfully, but Publish ForgeCAD 6.0.1 was not successful: ${PUBLISH_CONCLUSION:-missing}" >&2
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Verify release-complete source contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          text = open('services/forge-engine/forge_engine/v600/__init__.py', encoding='utf-8').read()
          version = re.search(r'^MILESTONE_VERSION\s*=\s*"([^"]+)"\s*$', text, re.MULTILINE)
          complete = re.search(r'^RELEASE_COMPLETE\s*=\s*(True|False)\s*$', text, re.MULTILINE)
          assert version and version.group(1) == '6.0.1', version.group(1) if version else 'missing version'
          assert complete and complete.group(1) == 'True', '6.0.1 release provenance may bind only RELEASE_COMPLETE=True source'
          PY

      - name: Verify final release assets exist
        shell: bash
        run: |
          set -euo pipefail
          gh release view v6.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null
          mapfile -t ASSETS < <(gh release view v6.0.1 --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
          printf '%s\n' "${ASSETS[@]}"
          for expected in \
            ForgeCAD-Setup-6.0.1.exe \
            ForgeCAD-6.0.1-arm64.dmg \
            ForgeCAD-6.0.1-x64.dmg \
            SHA256SUMS.txt; do
            printf '%s\n' "${ASSETS[@]}" | grep -Fxq "$expected" || { echo "Missing release asset: $expected" >&2; exit 1; }
          done

      - name: Bind v6.0.1 tag and release notes to accepted SHA
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v6.0.1 "$RELEASE_SHA"
          git push --force origin refs/tags/v6.0.1
          gh release edit v6.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --title 'ForgeCAD 6.0.1' \
            --notes-file docs/RELEASE_6_0_1.md \
            --target "$RELEASE_SHA"

      - name: Verify provenance binding
        shell: bash
        run: |
          set -euo pipefail
          git fetch --tags --force
          TAG_SHA=$(git rev-list -n 1 v6.0.1)
          if [ "$TAG_SHA" != "$RELEASE_SHA" ]; then
            echo "v6.0.1 resolves to $TAG_SHA, expected $RELEASE_SHA" >&2
            exit 1
          fi
          gh release view v6.0.1 --repo "$GITHUB_REPOSITORY" --json name,tagName,url,assets \
            --jq '{name:.name, tag:.tagName, url:.url, assets:[.assets[].name]}'
          echo "ForgeCAD 6.0.1 release provenance: PASS ($RELEASE_SHA)"
