name: ForgeCAD 3.0 full regression

on:
  push:
    branches: [forgecad/3.0.0]
    paths:
      - 'services/forge-engine/**'
      - 'apps/desktop/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/v300-regression.yml'
  workflow_dispatch:

jobs:
  full-regression:
    name: Existing engineering stack + v3 world/identity/planner/capability model + desktop typecheck
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run complete existing engineering regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v300-full-scope
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '1'
        run: python -m forge_engine.full_scope_selftest
      - name: Run physical world model regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v300-world
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v300.world_model_selftest
      - name: Run deterministic identity resolution regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v300-identity
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v300.identity_resolution_selftest
      - name: Run world-aware planner regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v300-planner
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v300.planner_world_context_selftest
      - name: Run capability action safety regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v300-capabilities
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v300.capability_runtime_selftest
      - name: Run v3 API vertical slice
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v300-api
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '1'
        run: python -m forge_engine.v300.api_selftest
      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile=false
      - name: Typecheck desktop
        run: pnpm --filter @forgecad/desktop typecheck
