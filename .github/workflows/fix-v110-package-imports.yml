name: Fix vendored v1.1 package imports

on:
  push:
    branches: [forgecad/full-v110-scope]
    paths: [FIX_V110_PACKAGE_IMPORTS]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad/full-v110-scope
          fetch-depth: 0
      - name: Fix runtime-relative imports and validation adapter
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'services/forge-engine/forge_engine/v110/core.py': [
              ('        import assembly_validation\n        assembly=assembly_validation.validate_assembly', '        from . import assembly_validation\n        assembly=assembly_validation.validate_assembly'),
            ],
            'services/forge-engine/forge_engine/v110/acceptance_design.py': [
              ('        import assembly_validation\n        report["assembly"]=', '        from . import assembly_validation\n        report["assembly"]="),
              ('    import core\n    project=core.upgrade_project', '    from . import core\n    project=core.upgrade_project'),
            ],
            'services/forge-engine/forge_engine/v110/agents.py': [
              ('    import core\n', '    from . import core\n'),
              ('    import component_registry\n', '    from . import component_registry\n'),
            ],
          }
          for filename, rules in replacements.items():
            p = Path(filename)
            s = p.read_text()
            for old, new in rules:
              if old in s:
                s = s.replace(old, new)
            p.write_text(s)

          p = Path('services/forge-engine/forge_engine/engineering_state.py')
          s = p.read_text()
          s = s.replace('from .v110 import analysis\n', 'from .v110 import analysis\nfrom .v110 import assembly_validation\n')
          s = s.replace('from .v110 import software\n', 'from .v110 import software\nfrom .v110 import system_validation\n')
          old = '''    def validation(self) -> dict[str, Any]:\n        result = core.reality_check()\n        result["requirements"] = core.requirement_checks()\n        result["metrics"] = core.project_metrics()\n        return result\n'''
          new = '''    def validation(self) -> dict[str, Any]:\n        system = system_validation.validate_system(core.PROJECT)\n        try:\n            assembly = assembly_validation.validate_assembly(core.PROJECT, core.build_shape, min_clearance_mm=1.0)\n        except Exception as exc:\n            assembly = {"ok": False, "counts": {"error": 0, "warning": 1, "info": 0}, "risks": [{"severity": "warning", "code": "assembly_check_unavailable", "message": str(exc)}]}\n        risks = list(system.get("risks", [])) + list(assembly.get("risks", []))\n        counts = {level: sum(1 for risk in risks if risk.get("severity") == level) for level in ("error", "warning", "info")}\n        result = {**system, "ok": counts["error"] == 0, "counts": counts, "risks": risks, "assembly": assembly}\n        result["requirements"] = core.requirement_checks()\n        result["metrics"] = core.project_metrics()\n        return result\n'''
          if old not in s: raise SystemExit('validation adapter block not found')
          p.write_text(s.replace(old, new))
      - name: Commit namespace fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/forge-engine/forge_engine
          git commit -m "Fix vendored engineering package runtime imports"
          git push origin HEAD:forgecad/full-v110-scope
