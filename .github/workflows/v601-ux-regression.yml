name: ForgeCAD 6.0.1 UX Regression

on:
  push:
    branches: [forgecad/6.0.1]
    paths:
      - 'apps/desktop/**'
      - '.github/workflows/v601-ux-regression.yml'
      - 'services/forge-engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
  workflow_dispatch:

concurrency:
  group: forgecad-6.0.1-ux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ux:
    name: Desktop interaction and Copilot acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine

      - name: Install desktop dependencies
        run: pnpm install --prod=false --frozen-lockfile=false

      - name: Typecheck, test, and build desktop
        run: |
          pnpm --filter @forgecad/desktop typecheck
          pnpm --filter @forgecad/desktop test
          pnpm --filter @forgecad/desktop build

      - name: Install Chromium acceptance runtime
        run: pnpm --filter @forgecad/desktop exec playwright install --with-deps chromium

      - name: Start ForgeCAD engine
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_SESSION_TOKEN: test-session
          FORGECAD_OLLAMA_MODEL: qwen3:8b
          FORGECAD_DEMO_AGENT: '1'
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v601-ux-state
          CI: 'false'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: |
          python -m uvicorn forge_engine.desktop_entry:app --host 127.0.0.1 --port 8765 --log-level warning > "${RUNNER_TEMP}/forgecad-v601-engine.log" 2>&1 &
          echo $! > "${RUNNER_TEMP}/forgecad-v601-engine.pid"
          python - <<'PY'
          import json, time, urllib.request
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  request = urllib.request.Request('http://127.0.0.1:8765/v2/health')
                  with urllib.request.urlopen(request, timeout=2) as response:
                      body = json.load(response)
                  if body.get('ok') and body.get('api_version') == '2':
                      break
              except Exception:
                  time.sleep(.25)
          else:
              raise SystemExit('ForgeCAD engine did not become healthy')
          PY

      - name: Run focused UX regressions
        # These tests intentionally mutate one canonical Forge Engine project. Running
        # them in parallel would make independent resets/branch switches race each other.
        run: pnpm --filter @forgecad/desktop exec playwright test e2e/ux-regression.spec.ts e2e/keyboard-shortcuts.spec.ts --workers=1

      - name: Preserve 3.1 browser integration
        run: pnpm --filter @forgecad/desktop exec playwright test e2e/v310-integration.spec.ts --workers=1

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: forgecad-v601-ux-diagnostics
          path: |
            apps/desktop/test-results/**
            apps/desktop/playwright-report/**
            ${{ runner.temp }}/forgecad-v601-engine.log
          if-no-files-found: ignore
