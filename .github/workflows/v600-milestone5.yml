name: ForgeCAD 6.0 milestone 5 regression

on:
  push:
    branches: [forgecad/6.0.0]
    paths:
      - 'services/forge-engine/forge_engine/v600/physical_retest.py'
      - 'services/forge-engine/forge_engine/v600/physical_artifacts.py'
      - 'services/forge-engine/forge_engine/v600/physical_metrology.py'
      - 'services/forge-engine/forge_engine/v600/physical_test_execution.py'
      - 'services/forge-engine/forge_engine/v600/physical_specimens.py'
      - 'services/forge-engine/forge_engine/v600/physical_specimen_contract.py'
      - 'services/forge-engine/forge_engine/v600/physical_prediction_residuals.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_api.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_selftest.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_artifact_selftest.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_multicriterion_selftest.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_metrology_selftest.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_repeatability_selftest.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_specimen_selftest.py'
      - 'services/forge-engine/forge_engine/v600/milestone5_prediction_selftest.py'
      - 'services/forge-engine/forge_engine/v600/substitution_semantics.py'
      - 'services/forge-engine/forge_engine/v600/autonomous_repair.py'
      - 'services/forge-engine/forge_engine/desktop_entry.py'
      - '.github/workflows/v600-milestone5.yml'
  workflow_dispatch:

jobs:
  milestone-5:
    name: Revision-bound physical feedback and retest
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run milestone 5 revision-bound physical retest acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_selftest
      - name: Run milestone 5 content-addressed artifact acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5-artifacts
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_artifact_selftest
      - name: Run milestone 5 multi-object physical acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5-multi
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_multicriterion_selftest
      - name: Run milestone 5 uncertainty-aware metrology acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5-metrology
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_metrology_selftest
      - name: Run milestone 5 repeatable physical execution acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5-repeatability
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_repeatability_selftest
      - name: Run milestone 5 package-linked specimen provenance acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5-specimens
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_specimen_selftest
      - name: Run milestone 5 prediction-vs-observation residual acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m5-prediction
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone5_prediction_selftest
      - name: Preserve milestone 4 bounded autonomous repair
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m4
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone4_strategy_selftest
      - name: Preserve milestone 3 fresh-analysis repair
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m3-refresh
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.analysis_refresh_selftest
      - name: Preserve milestone 3 bounded repair
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m3
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone3_selftest
      - name: Preserve milestone 2 acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m2
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: |
          python -m forge_engine.v600.milestone2_selftest
          python -m forge_engine.v600.frame_mate_selftest
          python -m forge_engine.v600.constraint_rank_selftest
          python -m forge_engine.v600.mount_hardware_selftest
          python -m forge_engine.v600.mount_access_selftest
      - name: Preserve milestone 1 acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m1
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.selftest
      - name: Preserve ForgeCAD 3.1 integration regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v310
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v310.selftest
      - name: Preserve historical engineering regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-legacy
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '1'
        run: python -m forge_engine.full_scope_selftest
      - name: Re-run solid FEA benchmark
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-fea
          CI: 'true'
        run: python -m forge_engine.v200.structural_fea_selftest
