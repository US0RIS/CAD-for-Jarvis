name: ForgeCAD macOS Installers

on:
  push:
    branches: [main, forgecad/full-v110-scope]
    paths:
      - 'apps/desktop/**'
      - 'services/forge-engine/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/macos-installer.yml'
  workflow_dispatch:

jobs:
  build-macos:
    name: Build macOS ${{ matrix.arch }} DMG
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 80
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install and self-test full engineering layer
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine pyinstaller
          export PYTHONPATH="$GITHUB_WORKSPACE/services/forge-engine"
          export FORGECAD_DATA_DIR="$RUNNER_TEMP/forgecad-full-scope-selftest"
          python -m forge_engine.full_scope_selftest

      - name: Build standalone Forge Engine
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name forge-engine \
            --collect-all cadquery \
            --collect-all OCP \
            --collect-all vtkmodules \
            --collect-submodules forge_engine.v110 \
            --distpath services/forge-engine/dist \
            --workpath services/forge-engine/build/pyinstaller \
            --specpath services/forge-engine/build \
            services/forge-engine/forge_engine/desktop_entry.py
          chmod +x services/forge-engine/dist/forge-engine
          file services/forge-engine/dist/forge-engine

      - name: Smoke bundled Forge Engine full scope
        shell: bash
        run: |
          set -euo pipefail
          export FORGECAD_PORT=8878
          export FORGECAD_SESSION_TOKEN=installer-smoke
          export FORGECAD_OLLAMA_MODEL=qwen3:8b
          export FORGECAD_DATA_DIR="$RUNNER_TEMP/forgecad-bundled-smoke"
          services/forge-engine/dist/forge-engine > "$RUNNER_TEMP/forge-engine.log" 2>&1 &
          ENGINE_PID=$!
          trap 'kill "$ENGINE_PID" 2>/dev/null || true; wait "$ENGINE_PID" 2>/dev/null || true' EXIT
          for i in {1..160}; do
            if curl --fail --silent http://127.0.0.1:8878/v2/health > "$RUNNER_TEMP/health.json"; then break; fi
            sleep 0.25
          done
          cat "$RUNNER_TEMP/health.json"
          grep -q 'v1.1-full-scope' "$RUNNER_TEMP/health.json"
          curl --fail --silent -H 'X-ForgeCAD-Session: installer-smoke' http://127.0.0.1:8878/v2/component-registry/stats > "$RUNNER_TEMP/stats.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/stats.json')); assert d['total'] >= 1400; print('macOS registry', d['total'])"
          curl --fail --silent -H 'X-ForgeCAD-Session: installer-smoke' 'http://127.0.0.1:8878/v2/components?q=gear' > "$RUNNER_TEMP/search.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/search.json')); assert len(d['items']) > 30; print('macOS untruncated gear search', len(d['items']))"
          curl --fail --silent -H 'X-ForgeCAD-Session: installer-smoke' http://127.0.0.1:8878/v2/project/export > "$RUNNER_TEMP/design.focad"
          python -c "import zipfile,json; z=zipfile.ZipFile('$RUNNER_TEMP/design.focad'); m=json.loads(z.read('manifest.json')); assert m['format']=='focad' and m['format_version']==1; print('macOS .focad export verified')"

      - name: Install desktop dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Typecheck desktop
        run: pnpm --filter @forgecad/desktop typecheck

      - name: Build native DMG
        run: |
          pnpm --filter @forgecad/desktop build
          pnpm --filter @forgecad/desktop exec electron-builder --mac dmg --${{ matrix.arch }}

      - name: Verify DMG, signature integrity, and installed-copy engine full scope
        shell: bash
        run: |
          set -euo pipefail
          DMG="apps/desktop/release/ForgeCAD-1.1.2-${{ matrix.arch }}.dmg"
          test -f "$DMG"

          MOUNT="$RUNNER_TEMP/forgecad-mount"
          INSTALLED="$RUNNER_TEMP/forgecad-installed/ForgeCAD.app"
          mkdir -p "$MOUNT" "$(dirname "$INSTALLED")"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT"
          trap 'hdiutil detach "$MOUNT" -force >/dev/null 2>&1 || true' EXIT

          test -d "$MOUNT/ForgeCAD.app"
          /usr/bin/ditto "$MOUNT/ForgeCAD.app" "$INSTALLED"
          test -d "$INSTALLED"

          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$INSTALLED/Contents/Info.plist")
          test "$VERSION" = "1.1.2"
          echo "Installed app version: $VERSION"

          # The public CI build is ad-hoc signed (identity '-') so every nested Mach-O has
          # cryptographic signature integrity. Developer-ID signing/notarization can be
          # layered on when Apple credentials are available, but malformed/unsigned app
          # bundles must never ship again.
          codesign --verify --deep --strict --verbose=2 "$INSTALLED"
          codesign -dv --verbose=4 "$INSTALLED" 2>&1 | tee "$RUNNER_TEMP/codesign.txt"
          grep -q 'Signature=adhoc' "$RUNNER_TEMP/codesign.txt"

          ENGINE="$INSTALLED/Contents/Resources/forge-engine/forge-engine"
          test -x "$ENGINE"
          file "$ENGINE"
          case "${{ matrix.arch }}" in
            arm64) file "$ENGINE" | grep -q 'arm64' ;;
            x64) file "$ENGINE" | grep -q 'x86_64' ;;
          esac

          # The copy is now independent of the disk image. Unmount before starting
          # native OCP/VTK code so process teardown can never keep the DMG busy.
          hdiutil detach "$MOUNT"
          trap - EXIT

          export FORGECAD_PORT=8879
          export FORGECAD_SESSION_TOKEN=dmg-smoke
          export FORGECAD_DATA_DIR="$RUNNER_TEMP/forgecad-dmg-state"
          "$ENGINE" > "$RUNNER_TEMP/dmg-engine.log" 2>&1 &
          ENGINE_PID=$!
          trap 'kill "$ENGINE_PID" 2>/dev/null || true; wait "$ENGINE_PID" 2>/dev/null || true' EXIT

          HEALTH_OK=0
          for i in {1..200}; do
            if curl --fail --silent http://127.0.0.1:8879/v2/health > "$RUNNER_TEMP/dmg-health.json"; then
              HEALTH_OK=1
              break
            fi
            sleep 0.25
          done
          if [ "$HEALTH_OK" -ne 1 ]; then
            cat "$RUNNER_TEMP/dmg-engine.log" || true
            exit 1
          fi

          cat "$RUNNER_TEMP/dmg-health.json"
          grep -q '"engine_version":"1.1.2"' "$RUNNER_TEMP/dmg-health.json"
          grep -q 'v1.1-full-scope' "$RUNNER_TEMP/dmg-health.json"

          curl --fail --silent -H 'X-ForgeCAD-Session: dmg-smoke' http://127.0.0.1:8879/v2/component-registry/stats > "$RUNNER_TEMP/dmg-stats.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/dmg-stats.json')); assert d['total'] >= 1400; print('installed-copy registry', d['total'])"

          curl --fail --silent -H 'X-ForgeCAD-Session: dmg-smoke' 'http://127.0.0.1:8879/v2/components?q=gear' > "$RUNNER_TEMP/dmg-search.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/dmg-search.json')); assert len(d['items']) > 30; print('installed-copy untruncated search', len(d['items']))"

          curl --fail --silent -H 'X-ForgeCAD-Session: dmg-smoke' http://127.0.0.1:8879/v2/project/export > "$RUNNER_TEMP/installed-design.focad"
          python -c "import zipfile,json; z=zipfile.ZipFile('$RUNNER_TEMP/installed-design.focad'); m=json.loads(z.read('manifest.json')); assert m['format']=='focad'; print('installed-copy .focad export verified')"

          curl --fail --silent -H 'X-ForgeCAD-Session: dmg-smoke' http://127.0.0.1:8879/v2/scene > "$RUNNER_TEMP/dmg-scene.json"
          python -c "import json; d=json.load(open('$RUNNER_TEMP/dmg-scene.json')); assert d['authoritative'] is True; assert len(d['parts']) >= 6; assert all(len(p['mesh']['triangles']) >= 60 for p in d['parts'] if p.get('geometry_fidelity') in ('detailed_parametric','official_step','verified_step')); print('installed-copy scene parts', len(d['parts']))"

          kill "$ENGINE_PID" 2>/dev/null || true
          wait "$ENGINE_PID" 2>/dev/null || true
          trap - EXIT

          shasum -a 256 "$DMG"

      - name: Upload macOS installer
        uses: actions/upload-artifact@v4
        with:
          name: ForgeCAD-macOS-${{ matrix.arch }}-Installer
          path: apps/desktop/release/ForgeCAD-1.1.2-${{ matrix.arch }}.dmg
          if-no-files-found: error
          retention-days: 30
