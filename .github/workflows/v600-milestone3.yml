name: ForgeCAD 6.0 milestone 3 regression

on:
  push:
    branches: [forgecad/6.0.0]
    paths:
      - 'services/forge-engine/forge_engine/v600/repair_trials.py'
      - 'services/forge-engine/forge_engine/v600/milestone3_api.py'
      - 'services/forge-engine/forge_engine/v600/milestone3_selftest.py'
      - 'services/forge-engine/forge_engine/desktop_entry.py'
      - '.github/workflows/v600-milestone3.yml'
  workflow_dispatch:

jobs:
  milestone-3:
    name: Evidence-preserving bounded repair
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run milestone 3 bounded repair acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m3-repair
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone3_selftest
      - name: Preserve ForgeCAD 3.1 integration regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v310
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v310.selftest
