name: Fix realistic geometry import

on:
  push:
    branches: [forgecad/full-v110-scope]
    paths: ['.github/workflows/fix-realistic-import.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad/full-v110-scope
      - name: Add required import
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('services/forge-engine/forge_engine/engineering_state.py')
          s=p.read_text()
          needle='from .v110 import project_bundle\n'
          if 'from .v110 import physical_components\n' not in s:
              if needle not in s: raise SystemExit('import anchor missing')
              s=s.replace(needle, 'from .v110 import physical_components\n'+needle, 1)
              p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/forge-engine/forge_engine/engineering_state.py
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix high-fidelity scene geometry import'
          git push origin HEAD:forgecad/full-v110-scope
