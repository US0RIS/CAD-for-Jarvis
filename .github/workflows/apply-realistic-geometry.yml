name: Apply realistic purchased-component geometry

on:
  push:
    branches: [forgecad/full-v110-scope]
    paths:
      - 'services/forge-engine/forge_engine/v110/realistic_components.py'
      - '.github/workflows/apply-realistic-geometry.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad/full-v110-scope
          fetch-depth: 0
      - name: Patch geometry integration and release gates
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Route known purchased parts through the high-fidelity layer first.
          path = Path('services/forge-engine/forge_engine/v110/physical_components.py')
          text = path.read_text()
          marker = '# ForgeCAD high-fidelity purchased-component override'
          if marker not in text:
              text += '''\n\n# ForgeCAD high-fidelity purchased-component override\n# Manufacturer STEP or a part-specific detailed model is attempted before the\n# broad legacy envelope catalog.  Generic geometry remains available only for\n# catalog entries that do not yet have a high-fidelity implementation.\nfrom . import realistic_components as _realistic_components\n_legacy_component_parts = component_parts\n\ndef component_parts(obj):\n    component = component_definition(obj)\n    realistic = _realistic_components.component_parts(obj, component, allow_download=False) if component else None\n    return realistic if realistic else _legacy_component_parts(obj)\n\ndef component_geometry_status(obj):\n    component = component_definition(obj) or {}\n    status = _realistic_components.geometry_status(obj, component)\n    if status.get("resolved"):\n        return status\n    return {\n        **status,\n        "geometry_source": str((component.get("geometry") or {}).get("trust") or "legacy_fallback"),\n        "geometry_fidelity": str((component.get("geometry") or {}).get("fidelity") or "none"),\n    }\n'''
              path.write_text(text)

          # Publish actual rendered fidelity/source in the canonical scene manifest.
          path = Path('services/forge-engine/forge_engine/engineering_state.py')
          text = path.read_text()
          old = '''            meshes.append({\n                "id": str(obj["id"]), "name": str(obj.get("name") or obj["id"]),\n                "semantic_role": str((obj.get("semantic") or {}).get("role") or obj.get("kind") or "part"),\n                "mesh": mesh,\n                "explode_vector": explode,\n                "base_transform": deepcopy(obj.get("transform") or {"position": [0.0, 0.0, 0.0], "rotation_deg": [0.0, 0.0, 0.0], "scale": [1.0, 1.0, 1.0]}),\n                "programmable_workspace_id": str(obj["id"]) if isinstance(obj.get("code"), dict) else None,\n            })'''
          new = '''            geometry_status = physical_components.component_geometry_status(obj) if obj.get("kind") == "component" else {"geometry_source": "forgecad_brep", "geometry_fidelity": "exact_brep", "fallback": False}\n            meshes.append({\n                "id": str(obj["id"]), "name": str(obj.get("name") or obj["id"]),\n                "semantic_role": str((obj.get("semantic") or {}).get("role") or obj.get("kind") or "part"),\n                "mesh": mesh,\n                "explode_vector": explode,\n                "base_transform": deepcopy(obj.get("transform") or {"position": [0.0, 0.0, 0.0], "rotation_deg": [0.0, 0.0, 0.0], "scale": [1.0, 1.0, 1.0]}),\n                "programmable_workspace_id": str(obj["id"]) if isinstance(obj.get("code"), dict) else None,\n                "geometry_source": geometry_status.get("geometry_source"),\n                "geometry_fidelity": geometry_status.get("geometry_fidelity"),\n                "geometry_fallback": bool(geometry_status.get("fallback")),\n            })'''
          if old not in text:
              raise SystemExit('scene manifest block not found')
          path.write_text(text.replace(old, new, 1))

          # Acceptance gate: no purchased acceptance component may be an envelope/bounding box.
          path = Path('services/forge-engine/forge_engine/full_scope_selftest.py')
          text = path.read_text()
          text = text.replace(
              'from .v110 import acceptance_design, component_registry, project_bundle, software, system_validation',
              'from .v110 import acceptance_design, component_registry, physical_components, project_bundle, realistic_components, software, system_validation',
              1,
          )
          needle = '''    scene = PROJECT.scene_manifest()\n    assert scene["authoritative"] is True\n    assert len(scene["parts"]) >= 6\n    assert all(part["mesh"]["positions"] and part["mesh"]["triangles"] for part in scene["parts"])\n'''
          replacement = '''    scene = PROJECT.scene_manifest()\n    assert scene["authoritative"] is True\n    assert len(scene["parts"]) >= 6\n    assert all(part["mesh"]["positions"] and part["mesh"]["triangles"] for part in scene["parts"])\n    acceptance_geometry = {}\n    for obj in __import__("forge_engine.v110.core", fromlist=["PROJECT"]).PROJECT.get("objects", []):\n        component_id = obj.get("component_ref")\n        if component_id in realistic_components.ACCEPTANCE_COMPONENTS:\n            status = physical_components.component_geometry_status(obj)\n            acceptance_geometry[component_id] = status\n            assert component_registry.GEOMETRY_RANK.get(status.get("geometry_fidelity", "none"), 0) >= component_registry.GEOMETRY_RANK["detailed_parametric"], status\n            assert status.get("geometry_source") not in {"legacy_fallback", "legacy_estimate"}, status\n    assert set(acceptance_geometry) == set(realistic_components.ACCEPTANCE_COMPONENTS), acceptance_geometry\n'''
          if needle not in text:
              raise SystemExit('self-test scene block not found')
          text = text.replace(needle, replacement, 1)
          text = text.replace(
              '"snapshot_seconds": round(summary_seconds, 3),',
              '"snapshot_seconds": round(summary_seconds, 3),\n        "acceptance_geometry": acceptance_geometry,',
              1,
          )
          path.write_text(text)

          # Release builds opportunistically fetch manufacturer STEP, copy successful
          # assets into the package tree, then bundle them. Detailed parametric models
          # remain the deterministic fallback if a vendor download is unavailable.
          for workflow_name in ['windows-installer.yml', 'macos-installer.yml', 'vertical-slice.yml']:
              path = Path('.github/workflows') / workflow_name
              text = path.read_text()
              if 'Prefetch high-fidelity acceptance CAD' in text:
                  continue
              if workflow_name == 'windows-installer.yml':
                  anchor = '      - name: Install and self-test full engineering layer\n'
                  block = '''      - name: Prefetch high-fidelity acceptance CAD\n        shell: pwsh\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -e services/forge-engine\n          $env:FORGECAD_DATA_DIR = "$env:RUNNER_TEMP\\forgecad-cad-prefetch"\n          $env:PYTHONPATH = "$env:GITHUB_WORKSPACE\\services\\forge-engine"\n          python -m forge_engine.v110.realistic_components --prefetch-acceptance --allow-fallback\n          $source = Join-Path $env:FORGECAD_DATA_DIR 'component_registry\\assets\\manufacturer'\n          $target = Join-Path $env:GITHUB_WORKSPACE 'services\\forge-engine\\forge_engine\\v110\\assets\\manufacturer'\n          New-Item -ItemType Directory -Force -Path $target | Out-Null\n          if (Test-Path $source) { Copy-Item "$source\\*" $target -Force -ErrorAction SilentlyContinue }\n\n'''
              elif workflow_name == 'macos-installer.yml':
                  anchor = '      - name: Install and self-test full engineering layer\n'
                  block = '''      - name: Prefetch high-fidelity acceptance CAD\n        shell: bash\n        run: |\n          python -m pip install --upgrade pip\n          python -m pip install -e services/forge-engine\n          export FORGECAD_DATA_DIR="$RUNNER_TEMP/forgecad-cad-prefetch"\n          export PYTHONPATH="$GITHUB_WORKSPACE/services/forge-engine"\n          python -m forge_engine.v110.realistic_components --prefetch-acceptance --allow-fallback\n          mkdir -p services/forge-engine/forge_engine/v110/assets/manufacturer\n          cp -f "$FORGECAD_DATA_DIR"/component_registry/assets/manufacturer/* services/forge-engine/forge_engine/v110/assets/manufacturer/ 2>/dev/null || true\n\n'''
              else:
                  anchor = '      - name: Full engineering self-test\n'
                  block = '''      - name: Prefetch high-fidelity acceptance CAD\n        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}\n        run: |\n          python -m forge_engine.v110.realistic_components --prefetch-acceptance --allow-fallback\n\n'''
              if anchor not in text:
                  raise SystemExit(f'workflow anchor not found: {workflow_name}')
              path.write_text(text.replace(anchor, block + anchor, 1))

          # Make PyInstaller include any CAD assets successfully prefetched into the
          # source tree.  Wildcard discovery remains safe when the directory is empty.
          path = Path('.github/workflows/windows-installer.yml')
          text = path.read_text()
          needle = '            --collect-submodules forge_engine.v110 `\\n'
          if needle in text and '--add-data' not in text[text.find('Build standalone Forge Engine'):text.find('Smoke bundled Forge Engine')]:
              text = text.replace(needle, needle + '            --add-data "services/forge-engine/forge_engine/v110/assets;forge_engine/v110/assets" `\\n', 1)
          path.write_text(text)

          path = Path('.github/workflows/macos-installer.yml')
          text = path.read_text()
          needle = '            --collect-submodules forge_engine.v110 \\\n'
          if needle in text and '--add-data' not in text[text.find('Build standalone Forge Engine'):text.find('Smoke bundled Forge Engine')]:
              text = text.replace(needle, needle + '            --add-data "services/forge-engine/forge_engine/v110/assets:forge_engine/v110/assets" \\\n', 1)
          path.write_text(text)
          PY
      - name: Commit geometry integration
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No patch required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add services/forge-engine .github/workflows/windows-installer.yml .github/workflows/macos-installer.yml .github/workflows/vertical-slice.yml
          git commit -m 'Render acceptance hardware with high-fidelity CAD'
          git push origin HEAD:forgecad/full-v110-scope
