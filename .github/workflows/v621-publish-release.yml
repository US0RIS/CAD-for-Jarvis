name: ForgeCAD 6.2.1 Release Publication

on:
  push:
    branches: [forgecad/6.2.1]
    paths:
      - '.github/workflows/v621-publish-release.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: forgecad-6.2.1-publication
  cancel-in-progress: false

jobs:
  release:
    name: Publish validated ForgeCAD 6.2.1 installers
    runs-on: ubuntu-24.04
    timeout-minutes: 115
    env:
      RELEASE_SHA: 55103f534aa6247d2ad6144f399e3d2319367049
      QUALITY_RUN_ID: '35427325844'
      NATIVE_RUN_ID: '35427378507'
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}
      - name: Verify immutable release-source binding
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          python - <<'PY'
          import json
          from pathlib import Path
          package=json.loads(Path('apps/desktop/package.json').read_text())
          assert package['version']=='6.2.1', package['version']
          from importlib import metadata
          assert 'PROFILE_LIBRARY' in Path('services/forge-engine/forge_engine/v620/fabricated_profiles.py').read_text()
          print('6.2.1 product source verified')
          PY
      - name: Wait for full quality and native installer gates
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 190); do
            QUALITY=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}" --jq '.conclusion // ""')
            NATIVE=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${NATIVE_RUN_ID}" --jq '.conclusion // ""')
            echo "Quality: ${QUALITY:-in progress}; native: ${NATIVE:-in progress} (poll ${i}/190)"
            for gate in "$QUALITY" "$NATIVE"; do
              if test -n "$gate" && test "$gate" != success; then
                echo "Release blocked by failed required gate: $gate" >&2
                exit 1
              fi
            done
            if test "$QUALITY" = success && test "$NATIVE" = success; then
              test "$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${QUALITY_RUN_ID}" --jq '.head_sha')" = "$RELEASE_SHA"
              exit 0
            fi
            sleep 30
          done
          echo "Required release gates did not finish within the publication window" >&2
          exit 1
      - name: Download all validated native installers
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ env.NATIVE_RUN_ID }}
          github-token: ${{ github.token }}
          pattern: ForgeCAD-6.2.1-*-Installer
          merge-multiple: true
          path: dist
      - name: Verify installer set and generate SHA-256 manifest
        shell: bash
        run: |
          set -euo pipefail
          cd dist
          test -s ForgeCAD-Setup-6.2.1.exe
          test -s ForgeCAD-6.2.1-arm64.dmg
          test -s ForgeCAD-6.2.1-x64.dmg
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          sha256sum ForgeCAD-6.2.1-arm64.dmg ForgeCAD-6.2.1-x64.dmg ForgeCAD-Setup-6.2.1.exe > SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
      - name: Publish ForgeCAD 6.2.1
        shell: bash
        run: |
          set -euo pipefail
          cat > release-notes.txt <<'EOF'
          # ForgeCAD 6.2.1 — Mechanical modeling and reliability

          Adds seven editable fabricated CAD models: hollow tube, flanged spool,
          tapered nozzle, split cuff, guide eyelet, U bracket, and cartridge cup.
          These appear in the Components panel under Fabricated parametric shapes.
          They retain editable dimensions and work in portable .focad projects.

          Official purchased-component STEP geometry remains separate from generic
          fabrication templates. Validated exact CAD status avoids repeatedly
          re-importing expensive vendor STEP models across duplicate instances.

          New acceptance coverage checks B-rep validity, dimensions, analytically
          known volumes, degenerate-parameter rejection, .focad round-trips,
          preserved supplier identity and physical-verification boundaries,
          authoritative CAD/fallback behavior, authenticated profile insertion,
          viewport geometry, simulation regressions, and desktop tests.

          Windows x64, macOS Apple Silicon, and macOS Intel installers are
          individually built, installed, and smoke-tested from the pinned
          6.2.1 product source. The SHA256SUMS.txt manifest verifies downloads.
          This software update does not certify a physical product or provide
          pressure/load ratings for reference profiles.
          EOF
          gh release create v6.2.1 \
            dist/ForgeCAD-6.2.1-arm64.dmg \
            dist/ForgeCAD-6.2.1-x64.dmg \
            dist/ForgeCAD-Setup-6.2.1.exe \
            dist/SHA256SUMS.txt \
            --target "$RELEASE_SHA" \
            --title 'ForgeCAD 6.2.1' \
            --notes-file release-notes.txt
      - name: Verify published release identity and four exact assets
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/v6.2.1" --jq '.object.sha')" = "$RELEASE_SHA"
          test "$(gh release view v6.2.1 --json targetCommitish --jq '.targetCommitish')" = "$RELEASE_SHA"
          mapfile -t ACTUAL < <(gh release view v6.2.1 --json assets --jq '.assets[].name' | sort)
          EXPECTED=(ForgeCAD-6.2.1-arm64.dmg ForgeCAD-6.2.1-x64.dmg ForgeCAD-Setup-6.2.1.exe SHA256SUMS.txt)
          mapfile -t ORDERED < <(printf '%s\n' "${EXPECTED[@]}" | sort)
          test "${#ACTUAL[@]}" -eq 4
          for i in "${!ORDERED[@]}"; do test "${ACTUAL[i]}" = "${ORDERED[i]}"; done
          mkdir -p "$RUNNER_TEMP/verify"
          gh release download v6.2.1 --pattern SHA256SUMS.txt --dir "$RUNNER_TEMP/verify"
          cmp dist/SHA256SUMS.txt "$RUNNER_TEMP/verify/SHA256SUMS.txt"
          gh release view v6.2.1 --json url,targetCommitish,assets
