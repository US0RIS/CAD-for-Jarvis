name: ForgeCAD 6.0 release candidate

on:
  push:
    branches: [forgecad/6.0.0]
    paths:
      - 'services/forge-engine/forge_engine/v600/**'
      - 'services/forge-engine/forge_engine/desktop_entry.py'
      - 'services/forge-engine/pyproject.toml'
      - '.github/workflows/v600-release-candidate.yml'
  workflow_dispatch:

jobs:
  release-candidate:
    name: Cross-domain single-lineage release candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run ForgeCAD 6.0 cross-domain release candidate
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-rc
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.release_candidate_selftest
      - name: Re-run external chemistry milestone independently
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m6
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone6_selftest
      - name: Preserve milestone 5 physical-feedback stack
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: |
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5"
          python -m forge_engine.v600.milestone5_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5-artifacts"
          python -m forge_engine.v600.milestone5_artifact_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5-multi"
          python -m forge_engine.v600.milestone5_multicriterion_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5-metrology"
          python -m forge_engine.v600.milestone5_metrology_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5-repeatability"
          python -m forge_engine.v600.milestone5_repeatability_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5-specimens"
          python -m forge_engine.v600.milestone5_specimen_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m5-prediction"
          python -m forge_engine.v600.milestone5_prediction_selftest
      - name: Preserve milestones 4 through 1 and legacy stack
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
        run: |
          export FORGECAD_ACCEPTANCE_WORKSPACE=0
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m4"
          python -m forge_engine.v600.milestone4_strategy_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m3-refresh"
          python -m forge_engine.v600.analysis_refresh_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m3"
          python -m forge_engine.v600.milestone3_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m2"
          python -m forge_engine.v600.milestone2_selftest
          python -m forge_engine.v600.frame_mate_selftest
          python -m forge_engine.v600.constraint_rank_selftest
          python -m forge_engine.v600.mount_hardware_selftest
          python -m forge_engine.v600.mount_access_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v600-m1"
          python -m forge_engine.v600.selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-v310"
          python -m forge_engine.v310.selftest
          export FORGECAD_ACCEPTANCE_WORKSPACE=1
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-legacy"
          python -m forge_engine.full_scope_selftest
          export FORGECAD_DATA_DIR="${RUNNER_TEMP}/forgecad-fea"
          python -m forge_engine.v200.structural_fea_selftest
