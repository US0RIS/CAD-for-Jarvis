name: Patch STEP baseline protection

on:
  push:
    branches: [forgecad/full-v110-scope]
    paths: [PATCH_STEP_BASELINE_PROTECTION]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad/full-v110-scope
          fetch-depth: 0
      - name: Protect verified baseline during STEP import
        shell: python
        run: |
          from pathlib import Path

          p = Path('services/forge-engine/forge_engine/engineering_state.py')
          s = p.read_text()
          old = '''    def import_step_part(self, filename: str, data: bytes) -> dict[str, Any]:\n        obj = core.import_step_bytes(filename, data)\n        return {"object": obj, "project": self.snapshot()}\n'''
          new = '''    def import_step_part(self, filename: str, data: bytes) -> dict[str, Any]:\n        with core.LOCK:\n            core.ensure_mutable("human", f"Import STEP {filename}")\n            obj = core.import_step_bytes(filename, data)\n        return {"object": obj, "project": self.snapshot()}\n'''
          if old not in s:
              raise SystemExit('import_step_part block not found')
          p.write_text(s.replace(old, new))

          p = Path('services/forge-engine/forge_engine/full_scope_selftest.py')
          s = p.read_text()
          old = '''    with tempfile.TemporaryDirectory() as temp_dir:\n        step_path = Path(temp_dir) / "selftest.step"\n        cq.exporters.export(cq.Workplane("XY").box(10, 20, 5), str(step_path))\n        imported = PROJECT.import_step_part(step_path.name, step_path.read_bytes())\n        imported_id = str(imported["object"]["id"])\n        assert any(part["id"] == imported_id for part in PROJECT.scene_manifest()["parts"])\n'''
          new = '''    protected_branch = PROJECT.active_branch\n    protected_object_count = int(PROJECT.snapshot()["metrics"]["object_count"])\n    with tempfile.TemporaryDirectory() as temp_dir:\n        step_path = Path(temp_dir) / "selftest.step"\n        cq.exporters.export(cq.Workplane("XY").box(10, 20, 5), str(step_path))\n        imported = PROJECT.import_step_part(step_path.name, step_path.read_bytes())\n        imported_branch = PROJECT.active_branch\n        imported_id = str(imported["object"]["id"])\n        assert imported_branch != protected_branch\n        assert any(part["id"] == imported_id for part in PROJECT.scene_manifest()["parts"])\n        PROJECT.activate_branch(protected_branch)\n        assert int(PROJECT.snapshot()["metrics"]["object_count"]) == protected_object_count\n        assert not any(part["id"] == imported_id for part in PROJECT.snapshot()["parts"])\n        PROJECT.activate_branch(imported_branch)\n'''
          if old not in s:
              raise SystemExit('STEP self-test block not found')
          p.write_text(s.replace(old, new))
      - name: Commit protection fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/forge-engine/forge_engine/engineering_state.py services/forge-engine/forge_engine/full_scope_selftest.py
          git commit -m "Protect verified baselines during STEP import"
          git push origin HEAD:forgecad/full-v110-scope
