name: Patch fast project metrics

on:
  push:
    branches: [forgecad/full-v110-scope]
    paths: [PATCH_FAST_PROJECT_METRICS]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: forgecad/full-v110-scope
          fetch-depth: 0
      - name: Avoid rebuilding purchased geometry for project summary metrics
        shell: python
        run: |
          from pathlib import Path

          p = Path('services/forge-engine/forge_engine/v110/core.py')
          s = p.read_text()
          old = '''def project_metrics() -> dict[str, Any]:\n    vals=[object_metrics(o) for o in PROJECT["objects"] if o.get("visible",True)]; purchased=sum(o.get("kind")=="component" for o in PROJECT["objects"]); custom=len(PROJECT["objects"])-purchased\n    return {"object_count":len(PROJECT["objects"]),"purchased_component_count":purchased,"custom_part_count":custom,"connection_count":len(PROJECT.get("connections",[])),"mass_kg":sum(x["mass_kg"] for x in vals),"bom_cost_usd":sum(float(x.get("unit_cost_usd",0) or 0)*float(x.get("qty",1) or 1) for x in PROJECT.get("bom",[])),"active_design":ACTIVE_DESIGN}\n'''
          new = '''def _summary_mass_kg(obj: dict[str, Any]) -> float:\n    if obj.get("kind") == "component":\n        snapshot = obj.get("component_snapshot") or {}\n        if snapshot.get("mass_g") is not None:\n            return float(snapshot["mass_g"]) / 1000.0\n        definition = physical_components.component_definition(obj)\n        if definition and definition.get("mass_g") is not None:\n            return float(definition["mass_g"]) / 1000.0\n    return float(object_metrics(obj)["mass_kg"])\n\ndef project_metrics() -> dict[str, Any]:\n    visible=[o for o in PROJECT["objects"] if o.get("visible",True)]; purchased=sum(o.get("kind")=="component" for o in PROJECT["objects"]); custom=len(PROJECT["objects"])-purchased\n    return {"object_count":len(PROJECT["objects"]),"purchased_component_count":purchased,"custom_part_count":custom,"connection_count":len(PROJECT.get("connections",[])),"mass_kg":sum(_summary_mass_kg(o) for o in visible),"bom_cost_usd":sum(float(x.get("unit_cost_usd",0) or 0)*float(x.get("qty",1) or 1) for x in PROJECT.get("bom",[])),"active_design":ACTIVE_DESIGN}\n'''
          if old not in s:
              raise SystemExit('project_metrics block not found')
          p.write_text(s.replace(old, new))

          p = Path('services/forge-engine/forge_engine/full_scope_selftest.py')
          s = p.read_text()
          s = s.replace('import tempfile\n', 'import tempfile\nimport time\n')
          needle = '''    search = PROJECT.search_components("raspberry", limit=5)\n    assert any(item["id"] == "compute.raspberry_pi_5_8gb" for item in search)\n\n'''
          replacement = '''    search = PROJECT.search_components("raspberry", limit=5)\n    assert any(item["id"] == "compute.raspberry_pi_5_8gb" for item in search)\n\n    # UI mutations return a project snapshot; summary metrics must stay lightweight and\n    # must not rebuild every purchased component's B-rep merely to total authoritative mass.\n    summary_started = time.perf_counter()\n    summary = PROJECT.snapshot()\n    summary_seconds = time.perf_counter() - summary_started\n    assert summary["metrics"]["object_count"] >= 6\n    assert summary_seconds < 10.0, summary_seconds\n\n'''
          if needle not in s:
              raise SystemExit('self-test insertion point not found')
          s = s.replace(needle, replacement)
          s = s.replace('        "protected_baseline_unchanged": True,\n', '        "protected_baseline_unchanged": True,\n        "snapshot_seconds": round(summary_seconds, 3),\n')
          p.write_text(s)
      - name: Commit performance fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/forge-engine/forge_engine/v110/core.py services/forge-engine/forge_engine/full_scope_selftest.py
          git commit -m "Make project snapshots responsive after component changes"
          git push origin HEAD:forgecad/full-v110-scope
