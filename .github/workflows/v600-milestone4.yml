name: ForgeCAD 6.0 milestone 4 regression

on:
  push:
    branches: [forgecad/6.0.0]
    paths:
      - 'services/forge-engine/forge_engine/v600/autonomous_repair.py'
      - 'services/forge-engine/forge_engine/v600/milestone4_api.py'
      - 'services/forge-engine/forge_engine/v600/milestone4_selftest.py'
      - 'services/forge-engine/forge_engine/v600/analysis_refresh_repair.py'
      - 'services/forge-engine/forge_engine/desktop_entry.py'
      - '.github/workflows/v600-milestone4.yml'
  workflow_dispatch:

jobs:
  milestone-4:
    name: Bounded multi-strategy autonomous repair
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Run milestone 4 autonomous strategy acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m4
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone4_selftest
      - name: Preserve milestone 3 fresh-analysis repair
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m3-refresh
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.analysis_refresh_selftest
      - name: Preserve milestone 3 bounded repair
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m3
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.milestone3_selftest
      - name: Preserve milestone 2 acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m2
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: |
          python -m forge_engine.v600.milestone2_selftest
          python -m forge_engine.v600.frame_mate_selftest
          python -m forge_engine.v600.constraint_rank_selftest
          python -m forge_engine.v600.mount_hardware_selftest
          python -m forge_engine.v600.mount_access_selftest
      - name: Preserve milestone 1 acceptance
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v600-m1
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v600.selftest
      - name: Preserve ForgeCAD 3.1 integration regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-v310
          FORGECAD_SESSION_TOKEN: test-session
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '0'
        run: python -m forge_engine.v310.selftest
      - name: Preserve historical engineering regression
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-legacy
          CI: 'true'
          FORGECAD_ACCEPTANCE_WORKSPACE: '1'
        run: python -m forge_engine.full_scope_selftest
      - name: Re-run solid FEA benchmark
        env:
          PYTHONPATH: services/forge-engine
          FORGECAD_DATA_DIR: ${{ runner.temp }}/forgecad-fea
          CI: 'true'
        run: python -m forge_engine.v200.structural_fea_selftest
