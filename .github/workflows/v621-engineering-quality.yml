name: ForgeCAD 6.2.1 Engineering Quality

on:
  push:
    branches: [forgecad/6.2.1]
    paths:
      - 'services/forge-engine/**'
      - 'apps/desktop/**'
      - '.github/workflows/v621-engineering-quality.yml'
      - 'pnpm-lock.yaml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: forgecad-621-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Parametric CAD, purchased geometry and desktop regression
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    env:
      FORGECAD_DATA_DIR: /tmp/forgecad-v621-quality
      FORGECAD_ALLOW_CAD_DOWNLOADS: '0'
      FORGECAD_BACKGROUND_GEOMETRY: '0'
      FORGECAD_ACCEPTANCE_WORKSPACE: '0'
      FORGECAD_SESSION_TOKEN: test-session
      CI: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Forge Engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e services/forge-engine
      - name: Verify seven fabricated profiles and .focad interchange
        run: python -m forge_engine.v620.fabricated_profiles_selftest
      - name: Verify official CAD, fallback, identity and fast repeated status
        run: |
          python -m forge_engine.v620.selftest
          python -m forge_engine.v620.hardening_selftest
          python -m forge_engine.v620.runtime_selftest
      - name: Preserve 6.1 simulation and 6.0.1 runtime acceptance
        run: |
          python -m forge_engine.v610.selftest
          python -m forge_engine.v610.thermal_field_selftest
          python -m forge_engine.v601_selftest
          python -m forge_engine.v601_scene_selftest
          python -m forge_engine.v601_ollama_selftest
      - name: Smoke canonical HTTP scene for fabricated profiles
        run: |
          python - <<'PY'
          from fastapi.testclient import TestClient
          from forge_engine.desktop_entry import app
          from forge_engine.v110 import core
          from forge_engine.v620.fabricated_profiles import PROFILE_LIBRARY
          client=TestClient(app)
          headers={'X-ForgeCAD-Session':'test-session'}
          profiles=client.get('/v6/fabricated-profiles',headers=headers)
          assert profiles.status_code==200,profiles.text
          entries=profiles.json()['profiles']
          assert len(entries)==7 and all(row['physical_verified'] is False for row in entries)
          old=list(core.PROJECT['objects'])
          try:
              profile=PROFILE_LIBRARY['flanged_spool']
              core.PROJECT['objects']=[{'id':'acceptance-spool','kind':'flanged_spool','name':'Parametric spool','params':profile['params'],'material':'petg','features':[],'semantic':{'role':'fabricated'},'visible':True,'transform':{'position':[0,0,0],'rotation_deg':[0,0,0],'scale':[1,1,1]}}]
              response=client.get('/v2/scene',headers=headers)
              assert response.status_code==200,response.text
              part=next(x for x in response.json()['parts'] if x['id']=='acceptance-spool')
              assert len(part['mesh']['triangles'])>48,part
              operation=client.post('/v2/operations',headers=headers,json={
                  'op':'add','args':{'kind':'hollow_tube','name':'Bench tube',
                  'params':PROFILE_LIBRARY['hollow_tube']['params'], 'material':'petg',
                  'semantic':{'role':'fabricated_reference_geometry','physical_verified':False}},
                  'reason':'Fabricated profile HTTP acceptance'})
              assert operation.status_code==200,operation.text
              assert any(row['name']=='Bench tube' for row in operation.json()['project']['parts'])
              health=client.get('/v6/component-fidelity/health',headers=headers)
              assert health.status_code==200,health.text
          finally:
              core.PROJECT['objects']=old
          PY
      - name: Install desktop dependencies
        run: pnpm install --prod=false --frozen-lockfile=false
      - name: Desktop typecheck, tests and production build
        run: |
          pnpm --filter @forgecad/desktop typecheck
          pnpm --filter @forgecad/desktop test
          pnpm --filter @forgecad/desktop build
