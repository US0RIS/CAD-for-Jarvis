[project]
name = "forge-engine"
version = "1.1.1"
description = "Local canonical engineering service for ForgeCAD"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
  "python-multipart>=0.0.20",
  "cadquery==2.6.1",
  "numpy>=2.0",
  "scipy>=1.14",
]

[project.optional-dependencies]
engineering = []

[tool.ruff]
line-length = 110
target-version = "py312"
