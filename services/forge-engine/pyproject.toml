[project]
name = "forge-engine"
version = "2.0.0.dev0"
description = "Local canonical engineering service for ForgeCAD"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "httpx>=0.27",
]

[project.optional-dependencies]
engineering = [
  "cadquery>=2.5",
  "numpy>=2.0",
  "scipy>=1.14",
]

[tool.ruff]
line-length = 110
target-version = "py312"
